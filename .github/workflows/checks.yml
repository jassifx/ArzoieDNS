name: PHP and database checks
# Run only trusted commits: never execute untrusted pull requests on a privileged self-hosted runner.
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    # Supply an EL 10 / Debian 13 self-hosted runner with PHP >=8.5.12, Composer and Docker.
    runs-on: [self-hosted, linux, arzoiedns-php85]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arzoie
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: arzoiedns_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U arzoie -d arzoiedns_test" --health-interval=5s --health-retries=10
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_USER: arzoie
          MARIADB_PASSWORD: test-only-password
          MARIADB_DATABASE: arzoiedns_test
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: php tests/lint.php && php tests/run.php && php tests/views.php
      - run: bash tests/member-helper.sh
      - run: php tests/database.php
        env:
          ARZOIE_TEST_DB: '1'
          DB_DRIVER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: arzoiedns_test
          DB_USERNAME: arzoie
          DB_PASSWORD: test-only-password
      - run: php tests/database.php
        env:
          ARZOIE_TEST_DB: '1'
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: arzoiedns_test
          DB_USERNAME: arzoie
          DB_PASSWORD: test-only-password
