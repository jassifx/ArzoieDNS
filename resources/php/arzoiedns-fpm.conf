[arzoiedns]
user = arzoie-web
group = arzoie-web
listen = /run/arzoiedns/php-fpm.sock
; Set to nginx on EL, www-data on Debian.
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[allow_url_include] = off
php_admin_value[session.save_path] = /var/lib/arzoiedns-web-sessions
php_admin_value[session.upload_progress.enabled] = 0
