# Set server_name, TLS certificate paths, PHP-FPM socket, and your admin networks.
server {
    listen 443 ssl;
    server_name dns.example.net;
    ssl_certificate /etc/pki/arzoiedns/fullchain.pem;
    ssl_certificate_key /etc/pki/arzoiedns/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/arzoiedns/public;
    index index.php;
    client_max_body_size 1m;

    # Prefer a management VPN. Change these to your management network.
    allow 127.0.0.1;
    allow ::1;
    deny all;

    location / { try_files $uri /index.php$is_args$args; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/arzoiedns/php-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
